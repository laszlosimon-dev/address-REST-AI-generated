services:
  mongodb:
    image: mongo:8.0
    container_name: address-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: addressdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: address-service
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongodb:27017/addressdb
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
